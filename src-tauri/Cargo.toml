[package]
name = "typoscope"
version = "0.1.0"
description = "A transparent reading guide overlay"
authors = ["aeliyagrover"]
edition = "2021"

[lib]
name = "typoscope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
device_query = "4.0"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1"
core-graphics = { version = "0.19", features = ["highsierra"] }
core-foundation = "0.7"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
